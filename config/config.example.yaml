# TowerCab configuration.
# Copied to /config/config.yaml on first start. Edits are picked up while the server runs;
# an invalid edit is logged and ignored.

airports:
  # Only `icao` is required. Name, reference point, field elevation and runways are read from
  # OurAirports, and any value written here overrides that data (lat, lon, elevationFt, name, city).
  # The time zone of the clock in the side panel comes from the position; close to the border between two zones
  # it can be the neighbour's, and then `timezone: America/Indiana/Tell_City` (for instance) puts it right.
  - icao: KLAF
    radiusNm: 6 # geofence radius around the airport reference point
    ceilingFtAgl: 5000 # hide traffic above this height over the field
    # Control tower, for the Tower cab view. Position from the FAA Digital Obstacle File of 2026-11-22
    # (OAS 18-023128, CTRL TWR, 84 ft AGL). heightM is the eye height, taken as a little below the top of
    # the structure, so it is marked approximate. Set `tower: null` to use OpenStreetMap, when it has one.
    tower: { lat: 40.414761, lon: -86.933297, heightM: 23, approximate: true }
    defaultView: tower # tower | overhead | orbit | rwy-<designator>, e.g. rwy-10
  - icao: KIND
    radiusNm: 8
    ceilingFtAgl: 6000
    # FAA Digital Obstacle File of 2026-11-22: OAS 18-002631, CTRL TWR, 348 ft AGL.
    tower: { lat: 39.708667, lon: -86.304458, heightM: 95, approximate: true }
    defaultView: overhead

# ADS-B sources. Lower priority number = preferred. Any combination can be enabled.
# Limits were checked against each service in November 2026; see docs/DECISIONS.md.
providers:
  # Your own receiver (tar1090 / ultrafeeder). The only reliable way to see ramp traffic.
  # Add `stream: { host: ultrafeeder, port: 30047 }` to read readsb's JSON position stream instead of polling.
  readsb: { enabled: false, url: "http://ultrafeeder/data/aircraft.json", priority: 0 }
  # 1 request per second, no key. Personal, non-commercial use; attribution and a link are required.
  adsbfi: { enabled: true, priority: 1 }
  # 500 requests per day without a key (ODbL). TowerCab paces itself to stay inside that.
  # A free key raises the limit: set ADSBLOL_API_KEY. See https://www.adsb.lol/docs/open-data/api/
  adsblol: { enabled: true, priority: 2 }
  # Off by default: the API now answers 403 until you have asked contact@airplanes.live for access.
  # If they give you a header to send, add `headers: { "Header-Name": "value" }` here.
  airplaneslive: { enabled: false, priority: 3 }
  # Fallback only, used when every other source is failing. Works anonymously (400 credits a day);
  # OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET raise that to 4,000.
  opensky: { enabled: false, priority: 9 }

polling:
  activeIntervalMs: 2000 # while at least one browser is watching an airport
  idleIntervalMs: 60000 # after the last viewer leaves
  pauseWhenNoViewersAfterMs: 300000 # then stop polling completely
  secondaryEveryN: 3 # the preferred public source is polled every cycle, the rest every Nth

# Live cameras. Ships empty on purpose: there is no dependable list of public streams for these
# airports, so add only streams you have checked yourself. docs/ADDING_A_CAMERA.md explains every field.
#
# cameras:
#   - id: ramp                      # letters, digits, "-" and "_"; used in addresses
#     airport: KLAF
#     name: Ramp, looking north
#     kind: youtube                 # youtube | hls | mjpeg | snapshot | iframe | webrtc
#     source: "VIDEO_ID"            # youtube: the video id of the live stream
#                                   # hls / mjpeg / snapshot / iframe: an http(s) address
#                                   # snapshot: also "windy:<webcam id>" (needs WINDY_API_KEY)
#                                   # webrtc: the name of a stream in go2rtc
#     attribution: Who runs the camera
#     link: "https://example.org/the-camera-page"
#     proxy: false                  # hls / mjpeg / snapshot: fetch through this server (see `proxy` below)
#     refreshSeconds: 30            # snapshot: seconds between pictures
#     # Where the camera is and where it points. Optional; easiest to set on the /admin page.
#     pose: { lat: 40.4148, lon: -86.9333, heightM: 12, headingDeg: 230, pitchDeg: -4, hfovDeg: 55 }
cameras: []

# The server fetches camera media on a browser's behalf only for cameras marked `proxy: true`, and
# only from the hosts listed here: "host", "host:port", "*.domain.tld" or an address such as
# "192.168.1.20:8080". Empty = the proxy is off.
proxy:
  allowlist: []
  # Let a host *name* on the list resolve to an address on a private network. Leave this off and list
  # the address itself for a camera on your own network.
  allowPrivateAddresses: false

# go2rtc, for `webrtc` cameras (your own RTSP camera). See the `cameras` profile in docker-compose.yml.
# go2rtc:
#   url: "http://go2rtc:1984"

# Camera discovery, run from the /admin page. Needs ADMIN_TOKEN plus YOUTUBE_API_KEY and/or
# WINDY_API_KEY. Nothing it finds is shown until you approve it there.
discovery:
  enabled: false
  intervalHours: 6 # a search is sent at most this often per airport; the last results are kept
  youtubeRadiusKm: 10 # live videos located this close to the airport
  windyRadiusKm: 15 # webcams this close to the airport

# Browsers draw the scene this far behind real time, so there is always a newer position to move towards.
client:
  renderDelayMs: 2500

# Pictures shown when an aircraft is selected.
photos:
  enabled: true # a photo of the aircraft itself, from planespotters.net
  types: true # when there is none, a picture of its type, from Wikimedia Commons

# Optional. Overpass API endpoint used for the airport layout (one query per airport per week).
# overpassUrl: "https://overpass-api.de/api/interpreter"
