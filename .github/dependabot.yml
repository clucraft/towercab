version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Small updates arrive together; a major version gets a pull request of its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Version 13 compiles from source on every install; 12 ships prebuilt binaries. See DECISIONS D-054.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
